{% extends "base.html" %}
{% block content %}

<h1>Update Profile</h1>
<form method="POST">
<div class="mb-3">
<label class="form-label">Name</label><br>

<input
type="text"
class="form-control"
name="name"
value="{{ user['name'] }}"
required
minlength="3"
maxlength="50"><br><br>

<label>Email</label><br>
<input
type="email"
class="form-control"
name="email"
value="{{ user['email'] }}"
required><br><br>

<label>Phone</label><br>
<input
type="tel"
class="form-control"
name="phone"
value="{{ user['phone'] }}"
required
pattern="[0-9]{10}"
title="Enter a valid 10-digit phone number."><br><br>

<button class="btn btn-success" name="action">Submit</button>
<br>

<a href="/user/dashboard" class="btn btn-secondary">Back to Dashboard</a>
</div>
</form>

{% endblock %}
