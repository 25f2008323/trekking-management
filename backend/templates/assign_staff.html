{% extends "base.html" %}
{% block content %}
<h1>Assign Staff To Trek</h1>

<form method="POST">
    <label>Select Trek</label>
    <select name="trek_id" required>
        {% for trek in treks %}
        <option value="{{ trek['trek_id'] }}">{{ trek["trek_name"] }}</option>
        {% endfor %}
    </select>

    <br><br>

    <label>Select Staff</label>
    <select name="staff_id" required>
        {% for member in staff %}
        <option value="{{ member['staff_id'] }}">{{ member["name"] }}</option>
        {% endfor %}
    </select>

    <br><br>

    <button class="btn btn-success">Assign</button>

</form>

{% endblock %}
