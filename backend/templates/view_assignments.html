{% extends "base.html" %}
{% block content %}

<h1>Assigned Staff</h1>

<div class="table-responsive">

<table class="table table-bordered table-striped table-hover">

<tr>
    <th>ID</th>
    <th>Trek</th>
    <th>Staff</th>
    <th>Assigned Date</th>
</tr>

{% for a in assignments %}

<tr>
    <td>{{ a["assignment_id"] }}</td>
    <td>{{ a["trek_name"] }}</td>
    <td>{{ a["staff_name"] }}</td>
    <td>{{ a["assigned_date"] }}</td>
</tr>

{% endfor %}

</table>
</div>

{% endblock %}
