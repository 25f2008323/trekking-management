{% extends "base.html" %}
{% block content %}

<h1>My Profile</h1>

<form method="POST">
<div class="mb-3">

<label class="form-label">Name</label>

<input
name="name" class="form-control"
value="{{ staff['name'] }}">

<br><br>
Email
<input
value="{{ staff['email'] }}" class="form-control"
disabled>

<br><br>
Phone
<input
type="tel"
class="form-control"
name="phone"
value="{{ staff['phone'] }}"
required
pattern="[0-9]{10}"
title="Enter a 10 digit number">

<br><br>
Experience
<input
type="number"
class="form-control"
name="experience"
value="{{ staff['experience'] }}"
required
min="0"
max="50">

<br><br>

<button name="action" class="btn btn-success">Update Profile</button>
</div>
</form>

<br>
<a href="/staff/dashboard" class="btn btn-secondary w-100 mb-2">Back</a>

{% endblock %}
