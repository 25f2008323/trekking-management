{% extends "base.html" %}
{% block content %}

<h1>User Dashboard</h1>

<div class="list-group">
<a href="/treks" class="btn btn-primary d-block">

View Available Treks

</a>

<br><br>

<a href="/mybookings" class="btn btn-primary d-block">My Bookings</a>
<h3>Booking Trend</h3>

<div class="chart-container">
<canvas id="trendChart"></canvas>
</div>

<script>

fetch("/user/trend-chart")
.then(r=>r.json())
.then(data=>{

new Chart(document.getElementById("trendChart"),{

type:"line",

data:{

labels:data.labels,

datasets:[{

label:"Bookings",

data:data.values,

fill:false

}]

},    options: {
        responsive: true
        
    }

});

});

</script>
<br><br>

<a href="/history" class="btn btn-primary d-block">Trekking History</a>
<h3>My Trek History</h3>

<div class="chart-container">
<canvas id="historyChart"></canvas>
</div>

<style>
.chart-container{
    width: 500px;
    height: 300px;
    margin: auto;
}
</style>

<script>
fetch("/user/history-chart")
.then(res => res.json())
.then(data => {
new Chart(document.getElementById("historyChart"), {
type: "bar",
data: {
labels: data.labels,
datasets: [{
label: "Visits",
data: data.values
}]
},
options: {
    responsive: true
}
});
});
</script>
<br><br>

<a href="/user/profile" class="btn btn-primary d-block">

Update Profile

</a>

<br><br>
</div>
<a href="/logout" class="btn btn-danger">

Logout

</a>



{% endblock %}
