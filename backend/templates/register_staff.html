{% extends "base.html" %}
{% block content %}

<form method="POST">
    <div class="mb-3">
        <label class="form-label">Name</label>
        
    <input name="name" 
    type="text"
    class="form-control"
     required 
     minlength="3"
     maxlength="50"
     title="Name should contain only letters and spaces"
    placeholder="Name">

    <input 
    type="email"
    class="form-control"
    required
    name="email" placeholder="Email">

    <input type="password" name="password" placeholder="Password"
    required minlength="3">

    </div>
    <button class="btn btn-success" name="action">Register</button>
</form>

{% endblock %}
