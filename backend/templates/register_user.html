{% extends "base.html" %}
{% block content %}

<form method="POST">
    <div class="mb-3">
        <label class="form-label">Name</label>
    <input type="text" class="form-control"
     name="name"
     required 
     minlength="3"
     maxlength="50"
     title="Name should contain only letters and spaces"
      placeholder="Name">

    <input 
        type="email" class="form-control"
        name="email" 
        required 
        placeholder="Email">

    <input type="password" name="password" placeholder="Password" minlength="4">
    
    <button name="action" class="btn btn-success">Register</button>
    </div>
</form>

{% endblock %}
