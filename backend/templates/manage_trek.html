{% extends "base.html" %}
{% block content %}

<h1>Manage Trek</h1>

<h1>{{ trek["trek_name"] }}</h1>

<p><strong>Location:</strong> {{ trek["location"] }}</p>
<p><strong>Status:</strong> {{ trek["status"] }}</p>
<p><strong>Progress:</strong>{{ trek["progress"] }}</p>
<p><strong>Available Slots:</strong> {{ trek["available_slots"] }}</p>

<hr>
<h3>Actions</h3>
<a href="/staff/trek/{{ trek['trek_id'] }}/edit" class="btn btn-secondary">Update Trek</a>

<br><br>
<a href="/staff/trek/{{ trek['trek_id'] }}/participants" class="btn btn-secondary">View Participants</a>
<br><br>

<a href="/staff/dashboard" class="btn btn-secondary">Back</a>
<br><br>

{% endblock %}
