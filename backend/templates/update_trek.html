{% extends "base.html" %}
{% block content %}

<h1>Update Trek</h1>

<form method="POST">
    <div class="mb-3">

<label class="form-label">Name</label>

    <p>
        Trek:
        <strong>{{ trek["trek_name"] }}</strong>
    </p>

    <label>Available Slots</label>

    <br>

    <input
        type="number"
        name="available_slots"
        class="form-control"
        value="{{ trek['available_slots'] }}"
        required>

    <br><br>

    <label>Status</label>

    <br>

<select name="status">
<option value="Open" {% if trek["status"]=="Open" %} selected{% endif %}>Open</option>
<option value="Closed" {% if trek["status"]=="Closed" %}selected{% endif %}> Closed</option>

</select>

<br><br>
<label>Progress</label>
<br>
<select name="progress">

<option value="Not Started" {% if trek["progress"]=="Not Started" %}selected{% endif %}>Not Started</option>
<option value="Started"{% if trek["progress"]=="Started" %}selected{% endif %}>Started</option>
<option value="Ongoing" {% if trek["progress"]=="Ongoing" %}selected{% endif %}> Ongoing</option>
<option value="Completed"{% if trek["progress"]=="Completed" %}selected{% endif %}>Completed</option>
</select>

<br><br>




<br>
 <button type= "submit" class="btn btn-success">Update</button>
<a href="/staff/dashboard" class="btn btn-secondary">Back</a>

</div>
</form>
{% endblock %}
