{% extends "base.html" %}
{% block content %}

<h1>Pending Staff Approvals</h1>

<div class="table-responsive">
<table class="table table-bordered table-striped table-hover">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Experience</th>
        <th>Action</th>
    </tr>

    {% for staff in staff_list %}
    <tr>
        <td>{{ staff["staff_id"] }}</td>
        <td>{{ staff["name"] }}</td>
        <td>{{ staff["email"] }}</td>
        <td>{{ staff["experience"] }}</td>

        <td>
            <a href="/admin/approve/{{ staff['staff_id'] }}" class="btn btn-secondary">Approve</a>
            |
            <a href="/admin/reject/{{ staff['staff_id'] }}" class="btn btn-secondary"> Reject</a>
        </td>
    </tr>
    {% endfor %}

</table>
</div>
<br>

<a href="/admin/dashboard" class="btn btn-secondary">Back to Dashboard</a>

{% endblock %}
