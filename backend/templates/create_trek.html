{% extends "base.html" %}
{% block content %}

<h1>Create Trek</h1>

<form method="POST">

    <div class="mb-3">
    <input type="text" class="form-control" required minlength="3" maxlength="100"
    name="trek_name" placeholder="Trek Name" required>
    <br><br>

    <input type="text" class="form-control" name="location" placeholder="Location" required>
    <br><br>

    <select name="difficulty" class="form-select" required>

        <option value="Easy">Easy</option>
        <option value="Moderate">Moderate</option>
        <option value="Hard">Hard</option>
    </select>
    <br><br>
    <input
        type="number" class="form-control" name="duration_days" placeholder="Duration" required min="1" max="30">
    <br><br>
    <input
        type="number" class="form-control" name="total_slots" placeholder="Total Slots" required>
    <br><br>
    <textarea
        name="description" class="form-control" placeholder="Description"></textarea>
    <br><br>
    <input
        type="number" class="form-control" step="500" name="price" placeholder="Price" required minlength="10" maxlength="500">

    <br><br>
    <input
        type="date" class="form-control" name="start_date" required>
    <br><br>
    <input
        type="date" class="form-control" name="end_date" required>

    <br><br>

    <button type="submit" name="action" class="btn btn-success"> Create Trek </button>
</form>
</div>

{% endblock %}
