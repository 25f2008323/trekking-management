{% extends "base.html" %}
{% block content %}

<h1>Book Trek</h1>

<h3>{{ trek["trek_name"] }}</h3>
<p>Location : {{ trek["location"] }}</p>
<p>Difficulty : {{ trek["difficulty"] }}</p>
<p>Available Slots : {{ trek["available_slots"] }}</p>
<p>Price : ₹{{ trek["price"] }}</p>

<form method="POST">
<div class="mb-3">
<label class="form-label">Number of People</label>

<input
type="number"
class="form-control"
name="number_of_people"
min="1"
max="{{ trek['available_slots'] }}"
value="1"
required>
</div>
<br><br>

<button type="submit" name ="action" class="btn btn-success" >Book Trek</button>
</form>
<br>

<a href="/treks" class="btn btn-secondary">Back</a>

{% endblock %}
