{% extends "base.html" %}
{% block content %}

<h1>Activity History</h1>

<div class="table-responsive">
<table class="table table-bordered table-striped table-hover">

<tr>
    <th>Log ID</th>
    <th>Entity type</th>
    <th>User ID</th>
    <th>Action</th>
    <th>Time</th>
</tr>

{% for log in logs %}
<tr>
    <td>{{ log["log_id"] }}</td>
    <td>{{ log["entity_type"] }}</td>
    <td>{{ log["entity_id"] }}</td>
    <td>{{ log["action"] }}</td>
    <td>{{ log["action_time"] }}</td>
</tr>
{% endfor %}

</table>
</div>

{% endblock %}
